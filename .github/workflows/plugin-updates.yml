name: Plugin Updates

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Link repo as nvim config
        run: ln -s "$PWD" ~/.config/nvim

      - name: Update plugins
        run: nvim --headless "+Lazy! update" +qa

      - name: Check config
        run: nvim --headless '+Lazy! restore' '+luafile .github/scripts/ci-check.lua' +qa

      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: lazy-lock.json
          branch: plugin-updates
          commit-message: 'build: update neovim plugins'
          title: 'build: update neovim plugins'
          labels: dependencies
