name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Link repo as nvim config
        shell: pwsh
        run: |
          $dest = if ($IsWindows) { Join-Path $env:LOCALAPPDATA 'nvim' } else { Join-Path $HOME '.config/nvim' }
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          New-Item -ItemType SymbolicLink -Path $dest -Target $PWD.Path | Out-Null

      - uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/nvim
            ~/AppData/Local/nvim-data
          key: ${{ runner.os }}-nvim-${{ hashFiles('lazy-lock.json') }}
          restore-keys: ${{ runner.os }}-nvim-

      - name: Check config
        run: nvim --headless '+Lazy! restore' '+luafile .github/scripts/ci-check.lua' +qa
